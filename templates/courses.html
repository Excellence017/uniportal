{% extends "base.html" %}
{% block title %}Courses{% endblock %}
{% block content %}
<h1>Course catalogue</h1>
<form method="get" class="search">
  <input name="q" value="{{ q }}" placeholder="Search by code or title" aria-label="Search">
  <button type="submit">Search</button>
</form>
<table>
  <thead><tr><th>Code</th><th>Title</th><th>Lecturer</th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr><td>{{ r.code }}</td><td>{{ r.title }}</td><td>{{ r.lecturer }}</td></tr>
  {% else %}
    <tr><td colspan="3">No courses match.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
