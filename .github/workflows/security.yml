# Security gate: runs on every push and pull request.
# Turn on branch protection for `main` (Settings > Branches > Require status checks)
# and select these jobs, so a pull request that fails any of them cannot be merged.
name: Security gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    name: Security regression tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -v

  sast:
    name: Static analysis (Semgrep + Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep bandit
      - name: Semgrep - custom UniPortal rules
        run: semgrep scan --config semgrep-rules/ --error --metrics=off
      - name: Semgrep - community Flask and Python rules
        run: semgrep scan --config p/flask --config p/python --error --metrics=off --severity ERROR
      - name: Bandit - medium and high severity
        run: bandit -r . -x ./tests,./scripts -ll

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --desc

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dast:
    name: Dynamic scan (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: security-tests
    steps:
      - uses: actions/checkout@v4
      - name: Start UniPortal
        run: |
          docker build -t uniportal .
          docker run -d --name uniportal -p 5000:5000 \
            -e UNIPORTAL_SECRET_KEY="ci-${{ github.run_id }}" uniportal
          for i in $(seq 1 30); do curl -fs http://localhost:5000/login >/dev/null && break; sleep 1; done
      - name: ZAP baseline scan (report only)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:5000
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report
